name: Selenium Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run TestNG Suite
        run: xvfb-run --auto-servernum mvn clean test -Dsurefire.suiteXmlFiles=testng.xml

      - name: Upload TestNG & Surefire Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            test-output/
